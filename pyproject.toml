[project]
name = "arctic-rush"
version = "0.1.0"
description = "Arctic Rush MuZero/MCTS training"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
    "numpy>=2.3.0",
    "tqdm>=4.67.1",
    "torch>=2.12.1,<2.13.0",
    "torchvision>=0.27.1,<0.28.0",
    "gym>=0.26.2",
    "matplotlib>=3.10.1",
    "tensorboard>=2.19.0",
    "stable-baselines3>=2.7.0",
    "gymnasium>=1.2.0",
    "pandas>=2.3.0",
    "opencv-python>=4.11.0.86",
    "psutil>=7.0.0",
    "rich>=14.0.0",
    "ale-py>=0.11.0",
    "farama-notifications>=0.0.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "loguru>=0.7.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests import the package as `src.core.*` / `src.game.*`, so the repository
# root -- not `src/` -- is what has to be importable.
pythonpath = ["."]
testpaths = ["tests"]
